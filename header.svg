<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" width="100%" height="280">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0a1a" />
      <stop offset="100%" stop-color="#14002e" />
    </linearGradient>
    
    <style>
      .pixel-serif {
        font-family: "Georgia", "Times New Roman", serif;
        font-size: 34px;
        fill: #ffffff;
        text-anchor: middle;
        font-weight: normal;
        letter-spacing: -0.5px;
        text-shadow: 0px 0px 8px rgba(0, 255, 255, 0.8), 2px 2px 0px rgba(255, 0, 128, 0.5);
      }
      .pixel-sub {
        font-family: "Courier New", monospace;
        font-size: 14px;
        fill: #00ffff;
        text-anchor: middle;
        letter-spacing: 1px;
      }
      .float {
        animation: floatAnim 4s ease-in-out infinite;
      }
      @keyframes floatAnim {
        0% { transform: translateY(0px); }
        50% { transform: translateY(-6px); }
        100% { transform: translateY(0px); }
      }
    </style>
    
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#000000" fill-opacity="0.6" />
    </pattern>
  </defs>

  <rect width="100%" height="100%" fill="url(#sky)" />

  <!-- Y2K Retro-Futurism Grid -->
  <g stroke="#00ffff" stroke-width="0.5" opacity="0.2">
    <!-- Horizontal lines -->
    <line x1="0" y1="40" x2="800" y2="40" />
    <line x1="0" y1="80" x2="800" y2="80" />
    <line x1="0" y1="120" x2="800" y2="120" />
    <line x1="0" y1="160" x2="800" y2="160" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="240" x2="800" y2="240" />
    <!-- Vertical lines -->
    <line x1="50" y1="0" x2="50" y2="280" />
    <line x1="150" y1="0" x2="150" y2="280" />
    <line x1="250" y1="0" x2="250" y2="280" />
    <line x1="350" y1="0" x2="350" y2="280" />
    <line x1="450" y1="0" x2="450" y2="280" />
    <line x1="550" y1="0" x2="550" y2="280" />
    <line x1="650" y1="0" x2="650" y2="280" />
    <line x1="750" y1="0" x2="750" y2="280" />
  </g>

  <!-- Stars / Particles -->
  <g fill="#ffffff">
    <circle cx="120" cy="50" r="1.5"><animate attributeName="opacity" values="0.2;1;0.2" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="680" cy="90" r="2"><animate attributeName="opacity" values="1;0.1;1" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="250" cy="30" r="1"><animate attributeName="opacity" values="0.5;1;0.5" dur="1.5s" repeatCount="indefinite"/></circle>
    <circle cx="550" cy="220" r="1.5"><animate attributeName="opacity" values="0;1;0" dur="4s" repeatCount="indefinite"/></circle>
  </g>

  <rect width="100%" height="100%" fill="url(#scanlines)" />

  <g class="float">
    <text x="400" y="110" class="pixel-serif">Construo operações escaláveis com IA</text>
    <text x="400" y="155" class="pixel-serif">e ajudo você a automatizar a sua</text>

    <text x="400" y="210" class="pixel-sub">&gt; DESENVOLVO PLATAFORMAS B2B NA ERA DO VIBE CODING_</text>
    <text x="400" y="235" class="pixel-sub">&gt; TIRO SUA OPERAÇÃO DA PLANILHA E COLOCO EM PRODUÇÃO_</text>
  </g>
</svg>